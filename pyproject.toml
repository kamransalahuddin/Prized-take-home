[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "board"
version = "0.1.0"
description = "A live board that coding agents post to and people read."
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
board = "board.cli:main"

[tool.setuptools]
packages = ["board"]

[tool.setuptools.package-data]
board = ["static/*", "static/vendor/*", "static/assets/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
